name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Full test suite must pass before anything ships
        run: |
          python -m pip install -e ".[dev]"
          python selftest.py
          python -m pytest tests -q
      - run: python -m pip install build
      - run: python -m build
      - name: Verify version matches tag
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(python -c "import re; m=re.search(r'^version = \"([^\"]+)\"', open('pyproject.toml', encoding='utf-8').read(), re.M); print(m.group(1))")"
          test "$expected" = "$actual"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Publish to PyPI as agentport-cli (trusted publishing - no stored token)
        # SEC-075 exception (documented): PyPA publishes this Docker action's
        # images ONLY under version tags - commit-SHA pins fail with
        # "manifest unknown". Integrity additionally covered by the
        # attestation step above.
        uses: pypa/gh-action-pypi-publish@v1.14.2
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
